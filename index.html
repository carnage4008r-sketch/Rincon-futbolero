<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rincón Futbolero - Liga Chinantla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a5c2e">
<link rel="icon" href="rincon_logo.png">
<style>
:root{--verde:#0a5c2e;--verde2:#0e7a3e;--naranja:#ff6b2b;--naranja2:#ff8a4a;--bg:#080d08;--card:#121a12;--border:#1e331e}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:white;padding-bottom:90px}
header{background:linear-gradient(135deg,#0a1a0f 0%,#111 100%);border-bottom:3px solid var(--naranja);padding:14px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
header img{width:62px;height:62px;border-radius:50%;border:2px solid var(--verde);background:white;object-fit:cover}
.card{margin:12px;background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--border)}
input,select{width:100%;padding:12px;border-radius:12px;border:1.5px solid #2a4a2a;background:#0a120a;color:white;margin:4px 0;font-size:14px}
input.gol{width:56px;text-align:center;color:var(--naranja);font-weight:900;border-color:var(--naranja);font-size:18px;background:#1a120a}
.btn{background:linear-gradient(135deg,var(--naranja),var(--naranja2));color:#111;border:none;padding:14px 18px;border-radius:14px;font-weight:900;width:100%;margin-top:10px}
.btn-outline{background:transparent;color:var(--verde2);border:2px solid var(--verde2);padding:12px;border-radius:14px;width:100%;margin-top:8px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;background:#1a261a;border:1.5px solid var(--verde);padding:12px 14px;border-radius:16px;margin:8px 0}
.team-logo{width:38px;height:38px;border-radius:50%;background:white;border:2px solid var(--verde);object-fit:cover}
.preview{width:72px;height:72px;border-radius:50%;border:3px solid var(--naranja);background:white;object-fit:cover;display:none;margin-top:8px}
.jornada{background:linear-gradient(90deg,var(--naranja),var(--naranja2));color:#111;padding:8px 14px;border-radius:12px;margin-top:16px;font-weight:900;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px;border-radius:14px;overflow:hidden}
th{background:linear-gradient(135deg,var(--verde),var(--verde2));color:white;padding:10px 5px;font-size:10px}th.orange{background:linear-gradient(135deg,var(--naranja),var(--naranja2));color:#111}
td{padding:10px 5px;text-align:center;border-bottom:1px solid #1e2e1e}
.campeon{background:linear-gradient(135deg,var(--naranja),var(--naranja2));color:#111;padding:16px;border-radius:16px;text-align:center;font-weight:900;margin-bottom:12px;font-size:14px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0a140a;border-top:2px solid var(--verde);display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.bottom-nav button{background:transparent;border:none;color:#5a7a5a;padding:6px 18px;display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:800}
.bottom-nav button.active{color:var(--naranja)}.bottom-nav button span{font-size:22px;margin-bottom:3px}
.muted{color:#7a9a7a;font-size:11px;text-align:center;margin-top:8px}
</style>
</head>
<body>
<header>
<img src="rincon_logo.png">
<div><h1 style="margin:0;color:var(--naranja);font-size:20px;line-height:1">RINCÓN<br>FUTBOLERO</h1><p style="margin:3px 0 0 0;color:var(--verde2);font-size:11px;font-weight:800">LIGA VETERANOS CHINANTLA</p></div>
</header>
<div id="screen-equipos" class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0;color:var(--verde2)">Equipos</h3><span id="count" style="color:var(--naranja);font-weight:900"></span></div>
<div id="listaEquipos" style="margin-top:10px"></div>
<div style="border:2px dashed var(--verde);border-radius:18px;padding:14px;background:#0a140a;margin-top:14px">
<input id="newName" placeholder="Nombre del equipo">
<input type="file" id="fileLogo" accept="image/*"><img id="preview" class="preview">
<button class="btn" style="background:linear-gradient(135deg,var(--verde),var(--verde2));color:white" onclick="agregarEquipo()">+ Agregar equipo</button>
<p id="msg" class="muted"></p>
</div>
<div style="height:1px;background:var(--border);margin:18px 0"></div>
<h4 style="margin:0 0 8px 0;color:var(--naranja)">Rol de juegos</h4>
<div style="display:flex;gap:8px"><select id="selJor"></select><input id="fecha" type="date" style="flex:1"></div>
<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><select id="local" style="flex:1"></select><b style="color:var(--naranja)">VS</b><select id="visita" style="flex:1"></select></div>
<button class="btn-outline" onclick="addPartido()">+ Agregar partido</button>
<div id="fix"></div>
<button class="btn" onclick="guardarLiga()">Guardar liga</button>
<button class="btn-outline" onclick="cargarEjemplo()">Cargar ejemplo 8 equipos</button>
</div>
<div id="screen-app" style="display:none">
<div id="tab-rol" class="card"><h3 style="color:var(--naranja)">Rol de juegos</h3><div id="rolContainer"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" onclick="calcularTabla()">Calcular tabla</button><button class="btn-outline" style="flex:1" onclick="volverEditar()">Editar</button></div></div>
<div id="tab-tabla" class="card" style="display:none"><h3 style="color:var(--verde2)">Tabla general</h3><table id="tablaGeneral"></table></div>
<div id="tab-goleo" class="card" style="display:none"><h3 style="color:var(--naranja)">Goleo individual</h3><div id="campeonBox" class="campeon">Sin goles registrados</div><div style="display:flex;gap:8px"><input id="jugadorGol" placeholder="Jugador" style="flex:1"><select id="equipoGol" style="width:130px"></select><input id="golesInput" type="number" placeholder="G" style="width:60px"></div><button class="btn" onclick="addGoles()">Agregar goles</button><table id="tablaGoleo"></table><button class="btn-outline" style="margin-top:12px" onclick="borrarGoleo()">Borrar goleo</button></div>
</div>
<div id="nav" class="bottom-nav" style="display:none">
<button id="nav-rol" class="active" onclick="showTab('rol')"><span>📋</span>ROL</button>
<button id="nav-tabla" onclick="showTab('tabla')"><span>📊</span>TABLA</button>
<button id="nav-goleo" onclick="showTab('goleo')"><span>⚽</span>GOLEO</button>
</div>
<script>
let equipos = JSON.parse(localStorage.getItem('equipos_rf')||'[]');
let fixture = JSON.parse(localStorage.getItem('fixture_rf')||'[]');
let resultados = JSON.parse(localStorage.getItem('resultados_rf')||'{}');
let goleadores = JSON.parse(localStorage.getItem('goleadores_rf')||'[]');
let tempLogo = '';
const $ = id => document.getElementById(id);
if(equipos.length===0){
 equipos=[{nombre:"TEHUITZINGO",logo:""},{nombre:"CHINANTLA",logo:""},{nombre:"TECOMATLAN",logo:""},{nombre:"AHUEHUETITLA",logo:""},{nombre:"VET. PIAXTLA",logo:""},{nombre:"PIAXTLA",logo:""},{nombre:"CUICATLAN",logo:""},{nombre:"SAN JUAN FC",logo:""}];
 localStorage.setItem('equipos_rf',JSON.stringify(equipos));
}
$('fileLogo').addEventListener('change', e=>{
 let f=e.target.files[0]; if(!f)return;
 let r=new FileReader();
 r.onload=ev=>{
  let img=new Image();
  img.onload=()=>{
   let c=document.createElement('canvas'); c.width=80; c.height=80;
   c.getContext('2d').drawImage(img,0,0,80,80);
   tempLogo=c.toDataURL('image/jpeg',0.6);
   $('preview').src=tempLogo; $('preview').style.display='block';
  }; img.src=ev.target.result;
 };
 r.readAsDataURL(f);
});
function normaliza(s){return s.trim().toUpperCase().replace(/\s+/g,' ');}
function refresh(){
 $('count').textContent=equipos.length+' equipos';
 $('listaEquipos').innerHTML=equipos.map((o,i)=>`<div class="row"><div style="display:flex;align-items:center;gap:12px"><img class="team-logo" src="${o.logo||'https://via.placeholder.com/60?text='+o.nombre.charAt(0)}"><b>${o.nombre}</b></div><span onclick="borrarEq(${i})" style="color:#ff6b6b;font-weight:900;cursor:pointer;padding:8px">✕</span></div>`).join('');
 let opts=equipos.map(o=>`<option value="${o.nombre}">${o.nombre}</option>`).join('');
 $('local').innerHTML=opts; $('visita').innerHTML=opts; $('equipoGol').innerHTML=opts;
 let sj=$('selJor'); sj.innerHTML=''; for(let i=1;i<=30;i++) sj.innerHTML+=`<option value="${i}">Jornada ${i}</option>`;
 renderFix();
}
function agregarEquipo(){
 let n=normaliza($('newName').value);
 if(!n){$('msg').textContent='Escribe un nombre';return;}
 if(equipos.some(e=>normaliza(e.nombre)===n)){ $('msg').textContent='"'+n+'" ya existe'; return;}
 if(equipos.length>=16){$('msg').textContent='Máximo 16';return;}
 equipos.push({nombre:n,logo:tempLogo||''});
 localStorage.setItem('equipos_rf',JSON.stringify(equipos));
 $('newName').value=''; $('fileLogo').value=''; tempLogo=''; $('preview').style.display='none'; $('msg').textContent='';
 refresh();
}
function borrarEq(i){equipos.splice(i,1); localStorage.setItem('equipos_rf',JSON.stringify(equipos)); refresh();}
function addPartido(){let j=parseInt($('selJor').value); let f=$('fecha').value||new Date().toISOString().split('T')[0]; let l=$('local').value; let v=$('visita').value; if(l===v){alert('Elige diferentes');return;} fixture.push({jor:j,fecha:f,local:l,visita:v}); localStorage.setItem('fixture_rf',JSON.stringify(fixture)); renderFix();}
function renderFix(){
 let html='<table><tr><th>J</th><th>LOCAL</th><th>VISITA</th><th></th></tr>';
 fixture.sort((a,b)=>a.jor-b.jor);
 fixture.forEach((x,i)=>{ html+=`<tr><td>${x.jor}</td><td style="text-align:left">${x.local}</td><td style="text-align:left">${x.visita}</td><td><button onclick="delF(${i})" style="background:#2a1111;color:#ff6b6b;border:1px solid #3a1a1a;border-radius:8px;padding:4px 10px">✕</button></td></tr>`; });
 html+='</table>'; $('fix').innerHTML=html;
}
function delF(i){fixture.splice(i,1); localStorage.setItem('fixture_rf',JSON.stringify(fixture)); renderFix();}
function guardarLiga(){ if(fixture.length===0){alert('Agrega partidos');return;} localStorage.setItem('fixture_rf',JSON.stringify(fixture)); $('screen-equipos').style.display='none'; $('screen-app').style.display='block'; $('nav').style.display='flex'; renderRol(); renderGoleo(); calcularTabla(); }
function volverEditar(){ $('screen-app').style.display='none'; $('screen-equipos').style.display='block'; $('nav').style.display='none'; refresh();}
function showTab(t){ $('tab-rol').style.display=t=='rol'?'block':'none'; $('tab-tabla').style.display=t=='tabla'?'block':'none'; $('tab-goleo').style.display=t=='goleo'?'block':'none'; document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active')); $('nav-'+t).classList.add('active'); if(t==='goleo') renderGoleo(); }
function renderRol(){
 let html=''; let jors=[...new Set(fixture.map(f=>f.jor))].sort((a,b)=>a-b);
 jors.forEach(j=>{
  html+=`<div class="jornada">JORNADA ${j} • ${fixture.find(f=>f.jor===j)?.fecha||''}</div>`;
  html+='<table><tr><th class="orange"></th><th class="orange">LOCAL</th><th class="orange">GL</th><th class="orange">GV</th><th class="orange">VISITA</th><th class="orange"></th></tr>';
  fixture.filter(f=>f.jor===j).forEach(f=>{
   let idx=fixture.indexOf(f); let r=resultados[idx]||{gl:'',gv:''};
   let logoL=equipos.find(e=>e.nombre===f.local)?.logo||''; let logoV=equipos.find(e=>e.nombre===f.visita)?.logo||'';
   html+=`<tr><td><img class="team-logo" src="${logoL||'https://via.placeholder.com/30'}" style="width:26px;height:26px"></td><td style="text-align:left">${f.local}</td><td><input class="gol" id="gl${idx}" type="number" inputmode="numeric" value="${r.gl}" onchange="saveRes(${idx})"></td><td><input class="gol" id="gv${idx}" type="number" inputmode="numeric" value="${r.gv}" onchange="saveRes(${idx})"></td><td style="text-align:left">${f.visita}</td><td><img class="team-logo" src="${logoV||'https://via.placeholder.com/30'}" style="width:26px;height:26px"></td></tr>`;
  });
  html+='</table>';
 });
 $('rolContainer').innerHTML=html;
}
function saveRes(i){ resultados[i]={gl:$('gl'+i).value,gv:$('gv'+i).value}; localStorage.setItem('resultados_rf',JSON.stringify(resultados)); }
function calcularTabla(){
 let tabla={}; equipos.forEach(o=>{tabla[o.nombre]={JJ:0,JG:0,JE:0,JP:0,GF:0,GC:0,PTS:0,logo:o.logo};});
 fixture.forEach((f,i)=>{
  let r=resultados[i]; if(!r||r.gl===''||r.gv==='') return;
  let gl=parseInt(r.gl)||0, gv=parseInt(r.gv)||0;
  if(!tabla[f.local]) tabla[f.local]={JJ:0,JG:0,JE:0,JP:0,GF:0,GC:0,PTS:0,logo:''};
  if(!tabla[f.visita]) tabla[f.visita]={JJ:0,JG:0,JE:0,JP:0,GF:0,GC:0,PTS:0,logo:''};
  tabla[f.local].JJ++; tabla[f.visita].JJ++;
  tabla[f.local].GF+=gl; tabla[f.local].GC+=gv;
  tabla[f.visita].GF+=gv; tabla[f.visita].GC+=gl;
  if(gl>gv){tabla[f.local].JG++; tabla[f.visita].JP++; tabla[f.local].PTS+=3;}
  else if(gv>gl){tabla[f.visita].JG++; tabla[f.local].JP++; tabla[f.visita].PTS+=3;}
  else{tabla[f.local].JE++; tabla[f.visita].JE++; tabla[f.local].PTS++; tabla[f.visita].PTS++;}
 });
 let arr=Object.entries(tabla).map(([eq,d])=>({eq,...d,DIF:d.GF-d.GC})).sort((a,b)=>b.PTS-a.PTS||b.DIF-a.DIF||b.GF-a.GF);
 let html='<tr><th>#</th><th></th><th style="text-align:left">EQUIPO</th><th>JJ</th><th>JG</th><th>JE</th><th>JP</th><th>GF</th><th>GC</th><th>DIF</th><th>PTS</th></tr>';
 arr.forEach((t,i)=>{ html+=`<tr><td>${i+1}</td><td><img class="team-logo" src="${t.logo||'https://via.placeholder.com/30'}" style="width:26px;height:26px"></td><td style="text-align:left"><b>${t.eq}</b></td><td>${t.JJ}</td><td>${t.JG}</td><td>${t.JE}</td><td>${t.JP}</td><td>${t.GF}</td><td>${t.GC}</td><td>${t.DIF}</td><td><b style="color:var(--naranja)">${t.PTS}</b></td></tr>`; });
 $('tablaGeneral').innerHTML=html;
 showTab('tabla');
}
function addGoles(){
 let jug=$('jugadorGol').value.trim().toUpperCase(); let eq=$('equipoGol').value; let g=parseInt($('golesInput').value)||0;
 if(!jug||g<=0) return;
 goleadores.push({jug,eq,gol:g});
 localStorage.setItem('goleadores_rf',JSON.stringify(goleadores));
 $('jugadorGol').value=''; $('golesInput').value='';
 renderGoleo();
}
function renderGoleo(){
 goleadores = JSON.parse(localStorage.getItem('goleadores_rf')||'[]');
 let agg={}; goleadores.forEach(o=>{ if(!agg[o.jug]) agg[o.jug]={eq:o.eq,goles:0}; agg[o.jug].goles+=o.gol; });
 let arr=Object.entries(agg).map(([jug,d])=>({jug,eq:d.eq,goles:d.goles})).sort((a,b)=>b.goles-a.goles);
 let html='<tr><th></th><th style="text-align:left">JUGADOR</th><th>EQUIPO</th><th>GOLES</th><th></th></tr>';
 arr.forEach((r,idx)=>{
  let logo=equipos.find(e=>e.nombre===r.eq)?.logo||'';
  html+=`<tr><td><img class="team-logo" src="${logo||'https://via.placeholder.com/30'}" style="width:26px;height:26px"></td><td style="text-align:left">${r.jug}</td><td>${r.eq}</td><td><b>${r.goles}</b></td><td><button onclick="delGol('${r.jug}')" style="background:#2a1111;color:#ff6b6b;border:1px solid #3a1a1a;border-radius:8px;padding:4px 8px">✕</button></td></tr>`;
 });
 $('tablaGoleo').innerHTML=arr.length?html:'<tr><td colspan="5" style="color:#666">Sin goles</td></tr>';
 if(arr.length>0){
  let max=Math.max(...arr.map(a=>a.goles));
  let camps=arr.filter(a=>a.goles===max);
  $('campeonBox').innerHTML=camps.length>1?`EMPATE • ${camps.map(c=>c.jug).join(' - ')} • ${max} GOLES`:`🏆 ${camps[0].jug} • ${camps[0].eq} • ${max} GOLES`;
 } else { $('campeonBox').textContent='Sin goles registrados'; }
}
function delGol(nombre){ goleadores = goleadores.filter(g=>g.jug!==nombre); localStorage.setItem('goleadores_rf',JSON.stringify(goleadores)); renderGoleo(); }
function borrarGoleo(){ if(confirm('¿Borrar todo el goleo?')){ localStorage.removeItem('goleadores_rf'); goleadores=[]; renderGoleo(); } }
function cargarEjemplo(){
 equipos=[{nombre:"TEHUITZINGO",logo:""},{nombre:"CHINANTLA",logo:""},{nombre:"TECOMATLAN",logo:""},{nombre:"AHUEHUETITLA",logo:""},{nombre:"VET. PIAXTLA",logo:""},{nombre:"PIAXTLA",logo:""},{nombre:"CUICATLAN",logo:""},{nombre:"SAN JUAN FC",logo:""}];
 fixture=[{jor:1,fecha:"2026-09-13",local:"TEHUITZINGO",visita:"CHINANTLA"},{jor:1,fecha:"2026-09-13",local:"TECOMATLAN",visita:"AHUEHUETITLA"},{jor:1,fecha:"2026-09-13",local:"VET. PIAXTLA",visita:"PIAXTLA"},{jor:1,fecha:"2026-09-13",local:"CUICATLAN",visita:"SAN JUAN FC"}];
 localStorage.setItem('equipos_rf',JSON.stringify(equipos)); localStorage.setItem('fixture_rf',JSON.stringify(fixture)); refresh();
}
(function init(){
 refresh(); renderGoleo();
 if(fixture.length>0){
   $('screen-equipos').style.display='none'; $('screen-app').style.display='block'; $('nav').style.display='flex'; renderRol(); calcularTabla(); renderGoleo();
 }
 if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
})();
</script>
</body>
</html>
