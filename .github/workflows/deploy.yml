name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
      - name: Crear Android
        run: |
          cp lib/main.dart /tmp/m.dart || true
          cp pubspec.yaml /tmp/p.yaml || true
          flutter create . --platforms=android --project-name=rincon_futbolero --org com.rincon --overwrite
          cp /tmp/m.dart lib/main.dart || true
          cp /tmp/p.yaml pubspec.yaml || true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Rincon-Futbolero-APK
          path: build/app/outputs/flutter-apk/app-release.apk
