name: build
on: {push: {branches: [main]}}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.3', channel: stable}
      - name: Build
        run: |
          rm -rf android ios lib
          flutter create. --platforms=android --project-name rincon_futbolero
          sed -i "s/8.1.0/8.3.0/g" android/settings.gradle
          sed -i "s/gradle-.*-all.zip/gradle-8.4-all.zip/g" android/gradle/wrapper/gradle-wrapper.properties
          pip install pillow -q
          python3 << 'PY'
          from PIL import Image
          im=Image.open('logo.png').convert('RGBA')
          bg=Image.new('RGBA',(1024,1024),(10,92,54,255))
          w,h=im.size; s=min(900/w,900/h)
          im2=im.resize((int(w*s),int(h*s)), Image.LANCZOS)
          bg.paste(im2,((1024-im2.width)//2,(1024-im2.height)//2),im2)
          for size,folder in [(48,'mipmap-mdpi'),(72,'mipmap-hdpi'),(96,'mipmap-xhdpi'),(144,'mipmap-xxhdpi'),(192,'mipmap-xxxhdpi')]:
            p=f'android/app/src/main/res/{folder}'
            __import__('os').makedirs(p,exist_ok=True)
            bg.resize((size,size), Image.LANCZOS).save(f'{p}/ic_launcher.png','PNG')
          PY
          mkdir -p assets
          cp logo.png assets/logo.png
          cp logo.png assets/rincon_logo.png
          cat > assets/Rifut.html <<'HTML'
          <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#080d08;color:white;font-family:Arial;padding:16px}header{background:#111;border-bottom:3px solid #ff6b2b;padding:14px;display:flex;gap:12px;align-items:center}header img{width:56px;height:56px;border-radius:50%;background:white}.card{background:#121a12;border-radius:18px;padding:14px;margin:12px 0;border:1px solid #1e331e}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #2a4a2a;background:#0a120a;color:white;margin:6px 0}button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:900;margin-top:8px;background:linear-gradient(135deg,#ff6b2b,#ff8a4a)}table{width:100%;border-collapse:collapse}th{color:#ff6b2b}td,th{padding:8px;border-bottom:1px solid #222;text-align:center}.gol{width:52px;color:#ff6b2b;font-weight:900;border-color:#ff6b2b}</style></head><body>
          <header><img src="logo.png"><b style="color:#ff6b2b">RINCON FUTBOLERO - YA FUNCIONA</b></header>
          <div class="card"><h3 style="color:#ff6b2b">ESTE ES EL APK BUENO</h3><p>Si ves esto, el verde se fue. Ahora vamos a cargar el HTML completo en el siguiente paso.</p><p>Equipos: <span id="c">0</span></p><input id="n" placeholder="Equipo"><button onclick="add()">Agregar</button><div id="l"></div></div>
          <script>let e=JSON.parse(localStorage.getItem('eq')||'[]');function r(){document.getElementById('c').innerText=e.length;document.getElementById('l').innerHTML=e.join('<br>')}function add(){let v=document.getElementById('n').value.trim().toUpperCase();if(!v)return;e.push(v);localStorage.setItem('eq',JSON.stringify(e));document.getElementById('n').value='';r()}r()</script></body></html>
          HTML
          cat > pubspec.yaml <<'EOF'
          name: rincon_futbolero
          environment: {sdk: '>=3.2.0 <4.0.0'}
          dependencies: {flutter: {sdk: flutter}, flutter_inappwebview: ^6.1.5}
          flutter: {uses-material-design: true, assets: [assets/Rifut.html, assets/logo.png, assets/rincon_logo.png]}
          EOF
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';import 'package:flutter/services.dart';import 'package:flutter_inappwebview/flutter_inappwebview.dart';
          void main() async {WidgetsFlutterBinding.ensureInitialized();runApp(const MaterialApp(debugShowCheckedModeBanner:false,home:App()));}
          class App extends StatefulWidget{const App({super.key});@override State<App> createState()=>_S();}
          class _S extends State<App>{String? h;@override void initState(){super.initState();rootBundle.loadString('assets/Rifut.html').then((v)=>setState(()=>h=v));}@override Widget build(BuildContext c){if(h==null)return const Scaffold(backgroundColor:Color(0xFF080D08),body:Center(child:CircularProgressIndicator()));return Scaffold(backgroundColor:Color(0xFF080D08),body:SafeArea(child:InAppWebView(initialData:InAppWebViewInitialData(data:h!,baseUrl:WebUri("https://localhost/"),mimeType:"text/html",encoding:"utf-8"),initialSettings:InAppWebViewSettings(javaScriptEnabled:true,domStorageEnabled:true,allowFileAccess:true,allowFileAccessFromFileURLs:true,allowUniversalAccessFromFileURLs:true))));}}
          EOF
      - name: pub get
        run: flutter pub get
      - name: build apk
        run: flutter build apk --release
      - name: subir apk
        uses: actions/upload-artifact@v4
        with:
          name: APK-RINCON-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
