name: build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Crear proyecto nativo
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/rincon/futbolero
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.3.0' apply false }" > build.gradle
          echo "distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rincon.futbolero'
              compileSdk 34
              defaultConfig { applicationId "com.rincon.futbolero"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rincon.futbolero">
              <application android:allowBackup="true" android:label="Rincon Futbolero" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rincon/futbolero/MainActivity.java <<'EOF'
          package com.rincon.futbolero;
          import android.os.Bundle; import android.webkit.WebSettings; import android.webkit.WebView; import android.webkit.WebViewClient; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              WebView web;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this); setContentView(web);
                  WebSettings s = web.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient()); web.loadUrl("file:///android_asset/Rifut.html");
              }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          EOF

          cp Rifut.html app/src/main/assets/Rifut.html || cp assets/Rifut.html app/src/main/assets/Rifut.html
          cp logo.png app/src/main/assets/logo.png || true

      - name: Build APK
        run: gradle :app:assembleDebug
      - name: subir apk
        uses: actions/upload-artifact@v4
        with:
          name: APK-RINCON-NATIVO
          path: app/build/outputs/apk/debug/app-debug.apk
