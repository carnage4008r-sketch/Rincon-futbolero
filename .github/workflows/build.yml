name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.3', channel: stable}
      - name: Build FINAL CON IMAGENES
        run: |
          rm -rf android ios lib
          flutter create . --platforms=android --project-name rincon_futbolero
          # FIX GRADLE - esto era lo que fallaba
          sed -i "s/8.1.0/8.3.0/g" android/settings.gradle
          sed -i "s/gradle-.*-all.zip/gradle-8.4-all.zip/g" android/gradle/wrapper/gradle-wrapper.properties
          pip install pillow -q
          python3 << 'PY'
          from PIL import Image
          import os
          im = Image.open('logo.png').convert('RGBA')
          bg = Image.new('RGBA', (1024,1024), (10,92,54,255))
          w,h = im.size
          scale = min(900/w, 900/h)
          im2 = im.resize((int(w*scale), int(h*scale)), Image.LANCZOS)
          bg.paste(im2, ((1024-im2.width)//2, (1024-im2.height)//2), im2)
          bg.save('logo_fixed.png','PNG')
          for size, folder in [(48,'mipmap-mdpi'),(72,'mipmap-hdpi'),(96,'mipmap-xhdpi'),(144,'mipmap-xxhdpi'),(192,'mipmap-xxxhdpi')]:
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              bg.resize((size,size), Image.LANCZOS).save(f'{path}/ic_launcher.png','PNG')
          PY
          mkdir -p assets
          cp Rifut.html assets/Rifut.html
          cp logo_fixed.png assets/logo.png
          cat > pubspec.yaml <<'EOF'
          name: rincon_futbolero
          description: Rincon Futbolero PRO
          version: 6.0.0+1
          environment: {sdk: '>=3.2.0 <4.0.0'}
          dependencies:
            flutter: {sdk: flutter}
            flutter_inappwebview: ^6.1.5
          flutter: {uses-material-design: true, assets: [assets/Rifut.html, assets/logo.png]}
          EOF
          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }
          class MyApp extends StatelessWidget{
            const MyApp({super.key});
            @override Widget build(BuildContext c)=>const MaterialApp(debugShowCheckedModeBanner: false, home: ProApp());
          }
          class ProApp extends StatefulWidget{const ProApp({super.key}); @override State<ProApp> createState()=>_ProAppState();}
          class _ProAppState extends State<ProApp>{
            String? htmlContent;
            @override void initState(){super.initState(); _loadHtml();}
            Future<void> _loadHtml() async {
              String html = await rootBundle.loadString('assets/Rifut.html');
              final bytes = (await rootBundle.load('assets/logo.png')).buffer.asUint8List();
              final b64 = base64Encode(bytes);
              html = html.replaceAll('logo.png', 'data:image/png;base64,$b64');
              html = html.replaceAll('./logo.png', 'data:image/png;base64,$b64');
              setState(()=> htmlContent = html);
            }
            @override Widget build(BuildContext b)=>Scaffold(
              backgroundColor: const Color(0xFF0A5C36),
              appBar: AppBar(title: const Text('RINCON FUTBOLERO PRO'), backgroundColor: const Color(0xFF0A5C36), foregroundColor: Colors.white),
              body: htmlContent == null ? const Center(child: CircularProgressIndicator(color: Colors.white)) :
              InAppWebView(
                initialData: InAppWebViewInitialData(data: htmlContent!),
                initialSettings: InAppWebViewSettings(
                  javaScriptEnabled: true,
                  allowFileAccess: true,
                  allowContentAccess: true,
                  domStorageEnabled: true,
                  allowFileAccessFromFileURLs: true,
                  allowUniversalAccessFromFileURLs: true,
                  useShouldOverrideUrlLoading: true,
                  javaScriptCanOpenWindowsAutomatically: true,
                ),
              ),
            );
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Rincon-Futbolero-FINAL-IMAGENES
          path: build/app/outputs/flutter-apk/app-release.apk
