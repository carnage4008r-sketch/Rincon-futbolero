name: build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable
      - name: crear
        run: flutter create. --platforms=android --project-name rincon_futbolero
      - name: icono
        run: |
          mkdir -p assets
          cp logo.png assets/logo.png || true
      - name: pub get
        run: flutter pub get
      - name: build apk
        run: flutter build apk --release
      - name: subir apk
        uses: actions/upload-artifact@v4
        with:
          name: APK-RINCON
          path: build/app/outputs/flutter-apk/app-release.apk
