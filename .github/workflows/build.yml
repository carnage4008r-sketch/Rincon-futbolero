name: build
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.3', channel: stable}
      - name: Build APK ICONO OK + WEB OK
        run: |
          rm -rf android ios lib
          flutter create . --platforms=android --project-name rincon_futbolero
          pip install pillow -q
          python3 << 'PY'
          from PIL import Image
          import os
          im = Image.open('logo.png').convert('RGBA')
          # fondo verde para que no se vea feo como icono
          bg = Image.new('RGBA', im.size, (10,92,54,255))
          # pega logo centrado
          bg.paste(im, (0,0), im)
          bg.save('logo_fixed.png','PNG')
          for size, folder in [(48,'mipmap-mdpi'),(72,'mipmap-hdpi'),(96,'mipmap-xhdpi'),(144,'mipmap-xxhdpi'),(192,'mipmap-xxxhdpi')]:
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              Image.open('logo_fixed.png').resize((size,size), Image.LANCZOS).save(f'{path}/ic_launcher.png','PNG')
              Image.open('logo_fixed.png').resize((size,size), Image.LANCZOS).save(f'{path}/ic_launcher_foreground.png','PNG')
          PY
          mkdir -p assets
          cp Rifut.html assets/Rifut.html
          cp logo_fixed.png assets/logo.png
          cat > pubspec.yaml <<'EOF'
          name: rincon_futbolero
          description: Rincon Futbolero PRO
          version: 5.1.0+1
          environment: {sdk: '>=3.2.0 <4.0.0'}
          dependencies:
            flutter: {sdk: flutter}
            webview_flutter: ^4.4.4
            file_picker: ^8.1.2
          flutter: {uses-material-design: true, assets: [assets/Rifut.html, assets/logo.png]}
          EOF
          cat > lib/main.dart <<'EOF'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          void main()=>runApp(const MyApp());
          class MyApp extends StatelessWidget{const MyApp({super.key}); @override Widget build(BuildContext c)=>const MaterialApp(debugShowCheckedModeBanner: false, home: ProApp());}
          class ProApp extends StatefulWidget{const ProApp({super.key}); @override State<ProApp> createState()=>_ProAppState();}
          class _ProAppState extends State<ProApp>{
            late final WebViewController ctrl;
            bool ready=false;
            @override void initState(){super.initState(); _load();}
            Future<void> _load() async {
              String html = await rootBundle.loadString('assets/Rifut.html');
              final bytes = (await rootBundle.load('assets/logo.png')).buffer.asUint8List();
              final b64 = base64Encode(bytes);
              html = html.replaceAll('logo.png', 'data:image/png;base64,$b64');
              html = html.replaceAll('./logo.png', 'data:image/png;base64,$b64');
              ctrl = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF0A5C36))
                ..loadHtmlString(html, baseUrl: 'https://localhost/');
              setState(()=> ready=true);
            }
            @override Widget build(BuildContext b)=>Scaffold(
              backgroundColor: const Color(0xFF0A5C36),
              appBar: AppBar(title: const Text('RINCON FUTBOLERO PRO'), backgroundColor: const Color(0xFF0A5C36), foregroundColor: Colors.white),
              body: !ready ? const Center(child: CircularProgressIndicator(color: Colors.white)) : WebViewWidget(controller: ctrl),
            );
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Rincon-Futbolero-ICONO-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
