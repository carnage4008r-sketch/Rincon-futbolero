name: build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Crear proyecto nativo
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/rincon/futbolero
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          // vacio, los plugins estan en settings
          EOF

          echo "distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rincon.futbolero'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rincon.futbolero"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.rincon.futbolero">
              <application android:allowBackup="true" android:label="Rincon Futbolero" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rincon/futbolero/MainActivity.java <<'EOF'
          package com.rincon.futbolero;
          import android.os.Bundle; import android.webkit.WebSettings; import android.webkit.WebView; import android.webkit.WebViewClient; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              WebView web;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this); setContentView(web);
                  WebSettings s = web.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true);
                  web.setWebViewClient(new WebViewClient()); web.loadUrl("file:///android_asset/Rifut.html");
              }
          }
          EOF

          # Copia tu html - busca donde este
          if [ -f Rifut.html ]; then cp Rifut.html app/src/main/assets/Rifut.html; fi
          if [ -f assets/Rifut.html ]; then cp assets/Rifut.html app/src/main/assets/Rifut.html; fi
          if [ -f logo.png ]; then cp logo.png app/src/main/assets/logo.png; fi

          ls -R app/src/main/

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: subir apk
        uses: actions/upload-artifact@v4
        with:
          name: APK-RINCON-NATIVO
          path: app/build/outputs/apk/debug/app-debug.apk
