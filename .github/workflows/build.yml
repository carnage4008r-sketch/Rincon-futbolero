name: build
on: {push: {branches: [main]}}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.27.3', channel: stable}
      - name: Build
        run: |
          rm -rf android ios lib
          flutter create . --platforms=android --project-name rincon_futbolero
          sed -i "s/8.1.0/8.3.0/g" android/settings.gradle
          sed -i "s/gradle-.*-all.zip/gradle-8.4-all.zip/g" android/gradle/wrapper/gradle-wrapper.properties
          pip install pillow -q
          python3 << 'PY'
          from PIL import Image
          im=Image.open('logo.png').convert('RGBA')
          bg=Image.new('RGBA',(1024,1024),(10,92,54,255))
          w,h=im.size; s=min(900/w,900/h)
          im2=im.resize((int(w*s),int(h*s)), Image.LANCZOS)
          bg.paste(im2,((1024-im2.width)//2,(1024-im2.height)//2),im2)
          for size,folder in [(48,'mipmap-mdpi'),(72,'mipmap-hdpi'),(96,'mipmap-xhdpi'),(144,'mipmap-xxhdpi'),(192,'mipmap-xxxhdpi')]:
            p=f'android/app/src/main/res/{folder}'
            __import__('os').makedirs(p,exist_ok=True)
            bg.resize((size,size), Image.LANCZOS).save(f'{p}/ic_launcher.png','PNG')
          PY
          mkdir -p assets
          cp logo.png assets/logo.png
          cp logo.png assets/rincon_logo.png
          cat > assets/Rifut.html <<'HTML'
          <!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Rincon Futbolero</title>
          <style>
          :root{--verde:#0a5c2e;--verde2:#0e7a3e;--naranja:#ff6b2b;--naranja2:#ff8a4a;--bg:#080d08;--card:#121a12;--border:#1e331e}
          *{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:white;padding-bottom:90px}
          header{background:linear-gradient(135deg,#0a1a0f 0%,#111 100%);border-bottom:3px solid var(--naranja);padding:14px 16px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
          header img{width:62px;height:62px;border-radius:50%;border:2px solid var(--verde);background:white;object-fit:cover}
          .card{margin:12px;background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--border)}
          input,select{width:100%;padding:12px;border-radius:12px;border:1.5px solid #2a4a2a;background:#0a120a;color:white;margin:4px 0;font-size:14px}
          input.gol{width:56px;text-align:center;color:var(--naranja);font-weight:900;border-color:var(--naranja);font-size:18px;background:#1a120a}
          .btn{background:linear-gradient(135deg,var(--naranja),var(--naranja2));color:#111;border:none;padding:14px 18px;border-radius:14px;font-weight:900;width:100%;margin-top:10px}
          .btn-outline{background:transparent;color:var(--verde2);border:2px solid var(--verde2);padding:12px;border-radius:14px;width:100%;margin-top:8px;font-weight:700}
          .row{display:flex;justify-content:space-between;align-items:center;background:#1a261a;border:1.5px solid var(--verde);padding:12px 14px;border-radius:16px;margin:8px 0}
          .team-logo{width:38px;height:38px;border-radius:50%;background:white;border:2px solid var(--verde);object-fit:cover}
          .preview{width:72px;height:72px;border-radius:50%;border:3px solid var(--naranja);background:white;object-fit:cover;display:none;margin-top:8px}
          .jornada{background:linear-gradient(90deg,var(--naranja),var(--naranja2));color:#111;padding:8px 14px;border-radius:10px;font-weight:900;margin:14px 0 6px;font-size:13px}
          table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--naranja);padding:8px 4px;text-align:center;border-bottom:1px solid #222}td{padding:8px 4px;text-align:center;border-bottom:1px solid #1a1a1a}
          .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0f1a0f;border-top:2px solid var(--verde);display:flex;justify-content:space-around;padding:8px 0;z-index:30}
          .bottom-nav button{background:transparent;border:none;color:#5a7a5a;padding:8px 18px;border-radius:12px;font-weight:700}
          .bottom-nav button.active{background:var(--verde);color:white}
          </style>
          </head>
          <body>
          <header><img src="logo.png" onerror="this.src='rincon_logo.png'"><div><b style="color:#ff6b2b">RINCÓN FUTBOLERO</b><br><small>LIGA CHINANTLA</small></div></header>
          <div id="screen-equipos">
          <div class="card"><h3 style="color:#ff6b2b;margin:0 0 8px">⚽ EQUIPOS (max 16)</h3><input id="newName" placeholder="Nombre equipo"><input type="file" id="fileLogo" accept="image/*"><img id="preview" class="preview"><div id="msg" style="color:#ff6b6b;font-size:13px;margin-top:6px"></div><button class="btn" onclick="agregarEquipo()">+ AGREGAR EQUIPO</button><div id="listaEquipos" style="margin-top:12px"></div>
          <hr style="border-color:#1a331a;margin:16px 0"><h3 style="color:#ff6b2b;margin:0 0 8px">📅 FIXTURE</h3><select id="selJor"></select><input id="fecha" type="date"><select id="local"></select><select id="visita"></select><button class="btn-outline" onclick="addPartido()">+ AGREGAR PARTIDO</button><div id="fix" style="margin-top:10px"></div><button class="btn" onclick="guardarLiga()">💾 GUARDAR Y VER TABLA</button><button class="btn-outline" onclick="cargarEjemplo()">Cargar ejemplo 8 equipos</button></div></div>
          <div id="screen-app" style="display:none"><div id="tab-rol" class="card"><div id="rolContainer"></div><button class="btn" onclick="calcularTabla()">🧮 CALCULAR TABLA</button><button class="btn-outline" onclick="volverEditar()">✏️ EDITAR LIGA</button></div><div id="tab-tabla" class="card" style="display:none"><h3 style="color:#ff6b2b">📊 TABLA GENERAL</h3><div style="overflow-x:auto"><table id="tablaGeneral"></table></div></div><div id="tab-goleo" class="card" style="display:none"><h3 style="color:#ff6b2b">🥅 GOLEO</h3><div id="campeonBox" style="background:linear-gradient(135deg,#ff6b2b,#ff8a4a);color:#111;padding:10px;border-radius:12px;font-weight:900;text-align:center;margin-bottom:10px">Sin goles</div><input id="jugadorGol" placeholder="Jugador"><select id="equipoGol"></select><input id="golesInput" type="number" placeholder="Goles"><button class="btn" onclick="addGoles()">+ AGREGAR GOLES</button><table id="tablaGoleo" style="margin-top:12px"></table><button class="btn-outline" onclick="borrarGoleo()">Borrar goleo</button></div></div>
          <div id="nav" class="bottom-nav" style="display:none"><button id="nav-rol" class="active" onclick="showTab('rol')">ROL</button><button id="nav-tabla" onclick="showTab('tabla')">TABLA</button><button id="nav-goleo" onclick="showTab('goleo')">GOLEO</button></div>
          <script>
          let $=id=>document.getElementById(id); let equipos=JSON.parse(localStorage.getItem('equipos_rf')||'[]'); let fixture=JSON.parse(localStorage.getItem('fixture_rf')||'[]'); let resultados=JSON.parse(localStorage.getItem('resultados_rf')||'{}'); let goleadores=JSON.parse(localStorage.getItem('goleadores_rf')||'[]'); let tempLogo='';
          function normaliza(s){return s.trim().toUpperCase();}
          $('fileLogo').addEventListener('change',e=>{ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{ tempLogo=ev.target.result; $('preview').src=tempLogo; $('preview').style.display='block'; }; r.readAsDataURL(f); });
          function refresh(){ let html=equipos.map((o,i)=>`<div class="row"><span style="display:flex;align-items:center;gap:8px"><img class="team-logo" src="${o.logo||'https://via.placeholder.com/30'}"><b>${o.nombre}</b></span><button onclick="borrarEq(${i})" style="background:#2a1111;color:#ff6b6b;border:1px solid #3a1a1a;border-radius:8px;padding:6px 12px">✕</button></div>`).join(''); let opts=equipos.map(o=>`<option value="${o.nombre}">${o.nombre}</option>`).join(''); $('local').innerHTML=opts; $('visita').innerHTML=opts; $('equipoGol').innerHTML=opts; let sj=$('selJor'); sj.innerHTML=''; for(let i=1;i<=30;i++) sj.innerHTML+=`<option value="${i}">Jornada ${i}</option>`; $('listaEquipos').innerHTML=html||'<small style="color:#666">Sin equipos</small>'; renderFix(); }
          function agregarEquipo(){ let n=normaliza($('newName').value); if(!n){$('msg').textContent='Escribe un nombre';return;} if(equipos.some(e=>normaliza(e.nombre)===n)){ $('msg').textContent='"'+n+'" ya existe'; return;} if(equipos.length>=16){$('msg').textContent='Máximo 16';return;} equipos.push({nombre:n,logo:tempLogo||''}); localStorage.setItem('equipos_rf',JSON.stringify(equipos)); $('newName').value=''; $('fileLogo').value=''; tempLogo=''; $('preview').style.display='none'; $('msg').textContent=''; refresh(); }
          function borrarEq(i){equipos.splice(i,1); localStorage.setItem('equipos_rf',JSON.stringify(equipos)); refresh();}
          function addPartido(){let j=parseInt($('selJor').value); let f=$('fecha').value||new Date().toISOString().split('T')[0]; let l=$('local').value; let v=$('visita').value; if(l===v){alert('Elige diferentes');return;} fixture.push({jor:j,fecha:f,local:l,visita:v}); localStorage.setItem('fixture_rf',JSON.stringify(fixture)); renderFix();}
          function renderFix(){ let html='<table><tr><th>J</th><th>LOCAL</th><th>VISITA</th><th></th></tr>'; fixture.sort((a,b)=>a.jor-b.jor); fixture.forEach((x,i)=>{ html+=`<tr><td>${x.jor}</td><td style="text-align:left">${x.local}</td><td style="text-align:left">${x.visita}</td><td><button onclick="delF(${i})" style="background:#2a1111;color:#ff6b6b;border:1px solid #3a1a1a;border-radius:8px;padding:4px 10px">✕</button></td></tr>`; }); html+='</table>'; $('fix').innerHTML=html; }
          function delF(i){fixture.splice(i,1); localStorage.setItem('fixture_rf',JSON.stringify(fixture)); renderFix();}
          function guardarLiga(){ if(fixture.length===0){alert('Agrega partidos');return;} localStorage.setItem('fixture_rf',JSON.stringify(fixture)); $('screen-equipos').style.display='none'; $('screen-app').style.display='block'; $('nav').style.display='flex'; renderRol(); renderGoleo(); calcularTabla(); }
          function volverEditar(){ $('screen-app').style.display='none'; $('screen-equipos').style.display='block'; $('nav').style.display='none'; refresh();}
          function showTab(t){ $('tab-rol').style.display=t=='rol'?'block':'none'; $('tab-tabla').style.display=t=='tabla'?'block':'none'; $('tab-goleo').style.display=t=='goleo'?'
