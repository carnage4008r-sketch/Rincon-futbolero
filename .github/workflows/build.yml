name: build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: stable

      - name: Crear proyecto
        run: flutter create. --platforms=android --project-name rincon_futbolero --overwrite

      - name: Configurar assets
        run: |
          mkdir -p assets
          if [ -f Rifut.html ]; then cp Rifut.html assets/Rifut.html; fi
          if [ -f assets/Rifut.html ]; then echo "Rifut ok"; else echo "FALTA Rifut.html en raiz"; exit 1; fi
          if [ -f logo.png ]; then cp logo.png assets/logo.png; fi
          ls -l assets/

      - name: Crear pubspec
        run: |
          cat > pubspec.yaml <<'EOF'
          name: rincon_futbolero
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_inappwebview: ^6.1.5
          flutter:
            uses-material-design: true
            assets:
              - assets/Rifut.html
              - assets/logo.png
          EOF

      - name: Crear main.dart
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';
          void main(){ WidgetsFlutterBinding.ensureInitialized(); runApp(const MaterialApp(debugShowCheckedModeBanner:false, home: App())); }
          class App extends StatefulWidget{ const App({super.key}); @override State<App> createState()=>_S(); }
          class _S extends State<App>{
            @override Widget build(BuildContext context){
              return Scaffold(
                backgroundColor: const Color(0xFF080D08),
                body: SafeArea(
                  child: InAppWebView(
                    initialFile: "assets/Rifut.html",
                    initialSettings: InAppWebViewSettings(javaScriptEnabled: true, domStorageEnabled: true, allowFileAccess: true),
                  ),
                ),
              );
            }
          }
          EOF

      - name: pub get
        run: flutter pub get

      - name: build apk
        run: flutter build apk --release

      - name: subir apk
        uses: actions/upload-artifact@v4
        with:
          name: APK-RINCON-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
